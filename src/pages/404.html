<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page introuvable - Nicolas Pandraud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Page statique copiee telle quelle par prerender.js : styles autonomes,
         memes couleurs que src/index.css et le hero de l'accueil. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0a0a0a;
        --surface: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --text: #e8e8e8;
        --muted: #777;
        --primary: #818cf8;
        --primary-dim: rgba(99, 102, 241, 0.18);
        --primary-border: rgba(129, 140, 248, 0.35);
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }

      .page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: url('/bg.webp') center / cover no-repeat;
        filter: brightness(0.18) blur(2px);
        transform: scale(1.04);
      }
      .page::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(170deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.55) 55%, rgba(10,10,10,0.95) 100%);
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        max-width: 640px;
        width: 100%;
        padding: 48px 24px;
        animation: fadeUp 0.8s ease both;
      }
      .badge {
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--primary);
        border: 1px solid var(--primary-border);
        padding: 5px 14px;
        border-radius: 999px;
        background: var(--primary-dim);
      }
      .code {
        font-size: clamp(6rem, 22vw, 10rem);
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 8px 40px rgba(129, 140, 248, 0.25));
      }
      h1 {
        font-size: clamp(1.4rem, 4vw, 1.9rem);
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .tagline {
        color: var(--muted);
        font-size: clamp(0.95rem, 2vw, 1.05rem);
        max-width: 480px;
      }

      /* Petit terminal : clin d'oeil DevOps */
      .terminal {
        width: 100%;
        max-width: 460px;
        text-align: left;
        background: rgba(17, 17, 17, 0.8);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
      }
      .terminal-bar {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .terminal-bar span {
        width: 10px; height: 10px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
      }
      .terminal pre {
        padding: 14px 16px;
        font: 0.82rem/1.7 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        color: #bbb;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .prompt { color: var(--primary); }
      .status { color: #f87171; }
      .ok { color: #34d399; }
      .cursor {
        display: inline-block;
        width: 0.55em; height: 1.1em;
        vertical-align: text-bottom;
        background: var(--primary);
        animation: blink 1.1s steps(1) infinite;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 6px;
      }
      .btn {
        padding: 12px 30px;
        border-radius: 999px;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--surface);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.2); }
      .btn.primary {
        color: var(--primary);
        border-color: var(--primary-border);
        background: var(--primary-dim);
      }
      .btn.primary:hover {
        background: rgba(99, 102, 241, 0.28);
        border-color: rgba(129, 140, 248, 0.6);
        box-shadow: 0 0 24px rgba(129, 140, 248, 0.2);
      }
      .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .content, .cursor { animation: none; }
      }
      @media (max-width: 640px) {
        .bg { background-image: url('/bg-mobile.webp'); }
        .content { gap: 18px; padding: 40px 20px; }
        .actions { width: 100%; flex-direction: column; }
        .btn { width: 100%; text-align: center; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="bg" aria-hidden="true"></div>
      <div class="content">
        <span class="badge">Erreur 404</span>
        <p class="code" aria-hidden="true">404</p>
        <h1>Cette page n'existe pas</h1>
        <p class="tagline">Le lien est peut-être ancien ou mal copié. Le reste du site, lui, est bien en ligne.</p>

        <div class="terminal" aria-hidden="true">
          <div class="terminal-bar"><span></span><span></span><span></span></div>
          <pre><span class="prompt">$</span> curl -I nicolas-pandraud.fr<span id="path">/page-inconnue</span>
<span class="status">HTTP/2 404 Not Found</span>
<span class="prompt">$</span> curl -I nicolas-pandraud.fr/
<span class="ok">HTTP/2 200 OK</span>
<span class="prompt">$</span> <span class="cursor"></span></pre>
        </div>

        <nav class="actions" aria-label="Pages du site">
          <a class="btn primary" href="/">Retour à l'accueil</a>
          <a class="btn" href="/cv">Voir mon CV</a>
        </nav>
      </div>
    </main>
    <script>
      // Affiche le chemin demandé dans le terminal (textContent : pas d'injection HTML)
      try {
        var p = decodeURIComponent(location.pathname);
        if (p && p !== '/') {
          document.getElementById('path').textContent = p.length > 48 ? p.slice(0, 45) + '...' : p;
        }
      } catch (e) {}
    </script>
  </body>
</html>
